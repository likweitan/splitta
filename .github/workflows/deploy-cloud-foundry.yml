name: Deploy to Cloud Foundry

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build MTA
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install MBT
        run: npm install -g mbt

      - name: Build MTA archive
        run: mbt build -t gen --mtar mta.tar

      - uses: actions/upload-artifact@v7
        with:
          name: mta
          path: backend/gen/mta.tar
          if-no-files-found: error

  deploy:
    name: Deploy to Cloud Foundry
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mta

      - name: Install Cloud Foundry CLI
        run: |
          curl -fsSL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | sudo tar -xz -C /usr/local/bin cf8 cf
          sudo ln -sf /usr/local/bin/cf8 /usr/local/bin/cf
          cf install-plugin -r CF-Community multiapps -f

      - name: Deploy
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
        run: |
          for v in CF_API CF_USERNAME CF_PASSWORD CF_ORG CF_SPACE; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is empty or not set"; missing=1; fi
          done
          [ -z "$missing" ] || exit 1
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"
          cf deploy mta.tar -f
